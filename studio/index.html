<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio &mdash; The Animist Apothecary</title>
  <link rel="icon" href="/favicon.ico" />
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage: #6b7d5a;
      --sage-dark: #2c5530;
      --cream: #f8f5f0;
      --earth: #2d2a26;
      --earth-light: #5a544c;
      --line: #e2dccf;
      --warn: #c53030;
      --ok: #1e7e34;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--earth);
      background: var(--cream);
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }
    aside {
      background: white;
      border-right: 1px solid var(--line);
      padding: 1.75rem 1.25rem;
      position: sticky; top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    aside h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 1.4rem; color: var(--sage-dark); margin: 0 0 0.25rem; }
    aside .sub { font-size: 0.78rem; color: var(--earth-light); margin-bottom: 1.5rem; }
    aside h3 { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--earth-light); margin: 1.5rem 0 0.5rem; font-weight: 500; }
    aside ul { list-style: none; padding: 0; margin: 0; }
    aside li { margin: 0.1rem 0; }
    aside a { display: block; padding: 0.5rem 0.75rem; color: var(--earth); text-decoration: none; border-radius: 4px; font-size: 0.92rem; transition: background 0.12s; }
    aside a:hover { background: var(--cream); }
    aside a.active { background: var(--sage); color: white; }
    aside a.stub { color: #aaa; cursor: not-allowed; }
    aside a.stub::after { content: ' (soon)'; font-size: 0.7rem; }
    main { padding: 2.5rem 3rem; max-width: 860px; }
    main h2 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 2rem; color: var(--sage-dark); margin: 0 0 0.25rem; }
    main .crumb { font-size: 0.85rem; color: var(--earth-light); margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem; }
    section.group { background: white; border: 1px solid var(--line); border-radius: 6px; padding: 1.5rem 1.75rem; margin-bottom: 1.5rem; }
    section.group h3 { margin: 0 0 1rem; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 1.25rem; color: var(--sage-dark); }
    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--earth); margin-bottom: 0.3rem; }
    .field .hint { display: block; font-size: 0.78rem; color: var(--earth-light); margin-bottom: 0.4rem; font-weight: 400; }
    .field input[type="text"], .field textarea, .field select {
      width: 100%; padding: 0.6rem 0.75rem;
      border: 1px solid var(--line); border-radius: 4px;
      font-family: inherit; font-size: 0.95rem;
      background: white; color: var(--earth);
    }
    .field textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
    .field select { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%235a544c' stroke-width='1.5'><path d='M1 1l5 5 5-5'/></svg>"); background-repeat: no-repeat; background-position: right 0.75rem center; padding-right: 2rem; }
    .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--sage); outline-offset: -1px; }

    /* Image field */
    .image-field { }
    .image-preview { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .image-preview img { max-width: 280px; max-height: 180px; border-radius: 4px; border: 1px solid var(--line); object-fit: cover; background: var(--cream); }
    .image-preview .meta { font-size: 0.8rem; color: var(--earth-light); flex: 1; min-width: 200px; }
    .image-preview .meta code { background: var(--cream); padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.75rem; word-break: break-all; }
    .file-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .file-row label.file-btn { background: white; border: 1px solid var(--sage-dark); color: var(--sage-dark); padding: 0.45rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.88rem; transition: background 0.12s; display: inline-block; margin-bottom: 0; font-weight: 500; }
    .file-row label.file-btn:hover { background: var(--cream); }
    .file-row input[type="file"] { display: none; }
    .upload-status { font-size: 0.82rem; }
    .upload-status.ok { color: var(--ok); }
    .upload-status.err { color: var(--warn); }
    .empty-img { width: 280px; height: 180px; display: flex; align-items: center; justify-content: center; color: var(--earth-light); font-size: 0.85rem; border: 1px dashed var(--line); border-radius: 4px; background: var(--cream); }

    .actions {
      position: sticky; bottom: 0;
      background: linear-gradient(to top, var(--cream) 70%, transparent);
      padding: 1.5rem 0 1rem; margin-top: 1rem;
      display: flex; gap: 0.75rem; align-items: center;
    }
    button { background: var(--sage-dark); color: white; border: 0; padding: 0.65rem 1.5rem; border-radius: 4px; font-family: inherit; font-size: 0.95rem; cursor: pointer; transition: background 0.12s; }
    button:hover { background: var(--earth); }
    button:disabled { background: #aaa; cursor: not-allowed; }
    button.ghost { background: transparent; color: var(--earth-light); border: 1px solid var(--line); }
    .status { font-size: 0.88rem; margin-left: 0.5rem; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--warn); }
    .empty, .loading { color: var(--earth-light); padding: 1.5rem 0; }
    a.live-link { color: var(--sage-dark); font-size: 0.85rem; text-decoration: none; margin-left: auto; }
    a.live-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <aside>
    <h1>Studio</h1>
    <div class="sub">The Animist Apothecary</div>

    <h3>Pages</h3>
    <ul id="navList"></ul>

    <h3>Coming next</h3>
    <ul id="navStubs"></ul>
  </aside>

  <main id="main"><div class="empty">Select a page on the left to start editing.</div></main>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    const API = 'https://wdecjlrfulsdklqeetqb.supabase.co/functions/v1/studio-api';
    const POSITION_OPTIONS = [
      { value: 'center top', label: 'Top' },
      { value: 'center 25%', label: 'Upper third' },
      { value: 'center 30%', label: 'Upper-mid (default)' },
      { value: 'center', label: 'Center' },
      { value: 'center 70%', label: 'Lower-mid' },
      { value: 'center bottom', label: 'Bottom' },
    ];

    const SIZE_OPTIONS = [
      { value: 'cover', label: 'Cover (fills, may crop edges)' },
      { value: 'contain', label: 'Contain (fits whole image, may show empty space)' },
    ];

    // Schemas: structured definition of every editable page.
    // Add a new entry here + a corresponding _content/<slug>.yml file in the repo.
    const SCHEMAS = {
      home: {
        title: 'Home Page',
        liveUrl: 'https://theanimistapothecary.com/',
        path: '_content/home.yml',
        groups: [
          {
            heading: 'Hero — top of page',
            fields: [
              { name: 'hero.eyebrow', label: 'Eyebrow', hint: 'Small caps line above the title', widget: 'text' },
              { name: 'hero.title', label: 'Main Title', hint: 'Use <em>word</em> for italic, <br> for line break', widget: 'text' },
              { name: 'hero.subtitle', label: 'Subtitle / Description', widget: 'textarea' },
              { name: 'hero.cta_primary_text', label: 'Primary Button — Text', widget: 'text' },
              { name: 'hero.cta_primary_url', label: 'Primary Button — Link URL', widget: 'text' },
              { name: 'hero.cta_secondary_text', label: 'Secondary Button — Text', widget: 'text' },
              { name: 'hero.cta_secondary_url', label: 'Secondary Button — Link URL', widget: 'text' },
              { name: 'hero.image', label: 'Hero Image', hint: 'Drop or pick a JPG/PNG/WebP. Recommended ~1600px wide.', widget: 'image' },
              { name: 'hero.image_alt', label: 'Image — Description for screen readers', widget: 'text' },
              { name: 'hero.image_position', label: 'Image — Vertical Position', hint: 'Where the visual focus of the image sits in the frame', widget: 'select', options: POSITION_OPTIONS },
              { name: 'hero.image_size', label: 'Image — Sizing Mode', widget: 'select', options: SIZE_OPTIONS },
            ],
          },
        ],
      },
    };

    // Pages on the roadmap but not yet wired (shown as stubs)
    const STUB_PAGES = [
      'About',
      'Community',
      'Sacred Reciprocity',
      'Book / Begin Here',
      'Divinations',
      'Deep Work',
      'Offerings (12 individual pages)',
    ];

    function getNested(obj, path) {
      return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
    }
    function setNested(obj, path, value) {
      const parts = path.split('.');
      let cur = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        if (cur[parts[i]] == null || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {};
        cur = cur[parts[i]];
      }
      cur[parts[parts.length - 1]] = value;
    }
    function escapeAttr(v) { return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

    let state = { slug: null, schema: null, data: null, sha: null, dirty: false };

    function setStatus(msg, cls) {
      const el = document.getElementById('saveStatus');
      if (!el) return;
      el.textContent = msg || '';
      el.className = 'status ' + (cls || '');
    }
    function markDirty() {
      state.dirty = true;
      const sb = document.getElementById('saveBtn'); if (sb) sb.disabled = false;
      const db = document.getElementById('discardBtn'); if (db) db.disabled = false;
      setStatus('Unsaved changes', 'err');
    }

    function buildNav() {
      const wired = document.getElementById('navList');
      wired.innerHTML = Object.entries(SCHEMAS).map(([slug, s]) =>
        `<li><a href="#${slug}" data-page="${slug}">${s.title}</a></li>`
      ).join('');
      const stubs = document.getElementById('navStubs');
      stubs.innerHTML = STUB_PAGES.map(name => `<li><a class="stub">${name}</a></li>`).join('');
    }

    async function loadPage(slug) {
      const schema = SCHEMAS[slug];
      if (!schema) return;
      state.slug = slug;
      state.schema = schema;
      const main = document.getElementById('main');
      main.innerHTML = '<div class="loading">Loading…</div>';
      document.querySelectorAll('aside a').forEach(a => a.classList.toggle('active', a.dataset.page === slug));

      try {
        const res = await fetch(`${API}/file?path=${encodeURIComponent(schema.path)}`, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { content, sha } = await res.json();
        state.sha = sha;
        state.data = jsyaml.load(content) || {};
        state.dirty = false;
        renderEditor();
      } catch (e) {
        main.innerHTML = `<div class="empty" style="color:var(--warn)">Failed to load: ${e.message}</div>`;
      }
    }

    function renderEditor() {
      const { schema, data } = state;
      const main = document.getElementById('main');
      const groupsHtml = schema.groups.map(g => `
        <section class="group">
          <h3>${g.heading}</h3>
          ${g.fields.map(f => fieldHtml(f, getNested(data, f.name) ?? '')).join('')}
        </section>
      `).join('');
      main.innerHTML = `
        <h2>${schema.title}</h2>
        <div class="crumb">Editing <code>${schema.path}</code> · saves commit to GitHub and deploy automatically (1–2 min) <a class="live-link" href="${schema.liveUrl}" target="_blank">view live page ↗</a></div>
        ${groupsHtml}
        <div class="actions">
          <button id="saveBtn" disabled>Save</button>
          <button class="ghost" id="discardBtn" disabled>Discard changes</button>
          <span id="saveStatus" class="status"></span>
        </div>
      `;
      schema.groups.forEach(g => g.fields.forEach(f => wireField(f)));
      document.getElementById('saveBtn').addEventListener('click', save);
      document.getElementById('discardBtn').addEventListener('click', () => loadPage(state.slug));
    }

    function fieldHtml(f, value) {
      const id = 'f-' + f.name.replace(/\./g, '-');
      const hint = f.hint ? `<span class="hint">${f.hint}</span>` : '';
      let inner = '';
      if (f.widget === 'textarea') {
        inner = `<textarea id="${id}">${escapeAttr(value)}</textarea>`;
      } else if (f.widget === 'select') {
        const opts = f.options.map(o => `<option value="${escapeAttr(o.value)}" ${o.value === value ? 'selected' : ''}>${o.label}</option>`).join('');
        inner = `<select id="${id}">${opts}</select>`;
      } else if (f.widget === 'image') {
        const v = String(value || '');
        const previewImg = v
          ? `<img id="${id}-preview" src="${escapeAttr(v)}" alt="">`
          : `<div id="${id}-preview" class="empty-img">No image yet</div>`;
        inner = `
          <div class="image-preview">
            ${previewImg}
            <div class="meta">
              <div>Current: <code id="${id}-current">${v ? escapeAttr(v) : '(none)'}</code></div>
              <div style="margin-top: 0.5rem; font-size: 0.78rem;">Replace by uploading a new file:</div>
            </div>
          </div>
          <div class="file-row">
            <label class="file-btn" for="${id}-file">Choose image…</label>
            <input type="file" id="${id}-file" accept="image/jpeg,image/png,image/webp,image/gif" />
            <span class="upload-status" id="${id}-status"></span>
          </div>
          <input type="hidden" id="${id}" value="${escapeAttr(v)}">
        `;
      } else {
        inner = `<input type="text" id="${id}" value="${escapeAttr(value)}" />`;
      }
      return `<div class="field"${f.widget === 'image' ? ' image-field' : ''}><label for="${id}">${f.label}</label>${hint}${inner}</div>`;
    }

    function wireField(f) {
      const id = 'f-' + f.name.replace(/\./g, '-');
      if (f.widget === 'image') {
        const fileInput = document.getElementById(id + '-file');
        if (!fileInput) return;
        fileInput.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          await uploadImage(file, f, id);
          fileInput.value = '';
        });
        return;
      }
      const inp = document.getElementById(id);
      if (!inp) return;
      const event = (f.widget === 'select') ? 'change' : 'input';
      inp.addEventListener(event, () => {
        setNested(state.data, f.name, inp.value);
        markDirty();
      });
    }

    async function uploadImage(file, f, id) {
      const statusEl = document.getElementById(id + '-status');
      const setUS = (msg, cls) => { statusEl.textContent = msg; statusEl.className = 'upload-status ' + (cls || ''); };
      if (file.size > 6_000_000) { setUS('File too large (max 6 MB)', 'err'); return; }
      if (!/^image\//.test(file.type)) { setUS('Not an image', 'err'); return; }
      setUS('Uploading…', '');
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(file);
        });
        const base64 = String(dataUrl).split(',')[1];
        const res = await fetch(`${API}/upload`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, data_base64: base64 }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        const url = json.path ? '/' + json.path : null;
        if (!url) throw new Error('no path returned');
        // Update hidden field + state + preview
        document.getElementById(id).value = url;
        setNested(state.data, f.name, url);
        const prev = document.getElementById(id + '-preview');
        if (prev) {
          if (prev.tagName === 'IMG') {
            prev.src = url;
          } else {
            prev.outerHTML = `<img id="${id}-preview" src="${escapeAttr(url)}" alt="">`;
          }
        }
        const cur = document.getElementById(id + '-current');
        if (cur) cur.textContent = url;
        setUS('Uploaded. Click Save below to publish.', 'ok');
        markDirty();
      } catch (e) {
        setUS('Upload failed: ' + e.message, 'err');
      }
    }

    async function save() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      setStatus('Saving…', '');
      const yaml = jsyaml.dump(state.data, { lineWidth: 100, noRefs: true });
      try {
        const res = await fetch(`${API}/file`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            path: state.schema.path,
            content: yaml,
            sha: state.sha,
            message: `Edit ${state.schema.title.toLowerCase()} via studio`,
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        state.sha = json.newSha || state.sha;
        state.dirty = false;
        const db = document.getElementById('discardBtn'); if (db) db.disabled = true;
        setStatus('Saved. Live in 1–2 minutes.', 'ok');
      } catch (e) {
        btn.disabled = false;
        setStatus('Save failed: ' + e.message, 'err');
      }
    }

    function handleHash() {
      const slug = (location.hash || '#home').slice(1);
      if (SCHEMAS[slug]) loadPage(slug);
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('beforeunload', e => {
      if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    (function start() {
      if (typeof jsyaml === 'undefined') { setTimeout(start, 50); return; }
      buildNav();
      handleHash();
    })();
  </script>
</body>
</html>
