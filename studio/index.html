<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="/favicon.ico" />
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage: #6b7d5a;
      --sage-dark: #2c5530;
      --cream: #f8f5f0;
      --earth: #2d2a26;
      --earth-light: #5a544c;
      --line: #e2dccf;
      --warn: #c53030;
      --ok: #1e7e34;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--earth);
      background: var(--cream);
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }
    aside {
      background: white; border-right: 1px solid var(--line);
      padding: 1.75rem 1.25rem;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    aside h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 1.4rem; color: var(--sage-dark); margin: 0 0 0.25rem; }
    aside .sub { font-size: 0.78rem; color: var(--earth-light); margin-bottom: 1.5rem; }
    aside h3 { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--earth-light); margin: 1.5rem 0 0.5rem; font-weight: 500; }
    aside ul { list-style: none; padding: 0; margin: 0; }
    aside li { margin: 0.1rem 0; }
    aside a { display: block; padding: 0.5rem 0.75rem; color: var(--earth); text-decoration: none; border-radius: 4px; font-size: 0.92rem; transition: background 0.12s; }
    aside a:hover { background: var(--cream); }
    aside a.active { background: var(--sage); color: white; }
    aside a.stub { color: #aaa; cursor: not-allowed; }
    aside a.stub::after { content: ' (soon)'; font-size: 0.7rem; }

    main { padding: 2.5rem 3rem 6rem; max-width: 880px; }
    main h2 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 2rem; color: var(--sage-dark); margin: 0 0 0.25rem; }
    main .crumb { font-size: 0.85rem; color: var(--earth-light); margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem; }

    section.group { background: white; border: 1px solid var(--line); border-radius: 6px; padding: 1.5rem 1.75rem; margin-bottom: 1.5rem; }
    section.group h3 { margin: 0 0 1rem; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 1.25rem; color: var(--sage-dark); }
    section.group .group-hint { font-size: 0.82rem; color: var(--earth-light); margin: -0.6rem 0 1rem; }

    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--earth); margin-bottom: 0.3rem; }
    .field .hint { display: block; font-size: 0.78rem; color: var(--earth-light); margin-bottom: 0.4rem; font-weight: 400; }
    .field input[type="text"], .field textarea, .field select {
      width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--line); border-radius: 4px;
      font-family: inherit; font-size: 0.95rem; background: white; color: var(--earth);
    }
    .field textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
    .field select { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%235a544c' stroke-width='1.5'><path d='M1 1l5 5 5-5'/></svg>"); background-repeat: no-repeat; background-position: right 0.75rem center; padding-right: 2rem; }
    .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--sage); outline-offset: -1px; }

    .image-preview { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .image-preview img { max-width: 280px; max-height: 180px; border-radius: 4px; border: 1px solid var(--line); object-fit: cover; background: var(--cream); }
    .image-preview .meta { font-size: 0.8rem; color: var(--earth-light); flex: 1; min-width: 200px; }
    .image-preview .meta code { background: var(--cream); padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.72rem; word-break: break-all; }
    .file-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .file-row label.file-btn { background: white; border: 1px solid var(--sage-dark); color: var(--sage-dark); padding: 0.45rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.88rem; transition: background 0.12s; display: inline-block; margin-bottom: 0; font-weight: 500; }
    .file-row label.file-btn:hover { background: var(--cream); }
    .file-row input[type="file"] { display: none; }
    .upload-status { font-size: 0.82rem; }
    .upload-status.ok { color: var(--ok); }
    .upload-status.err { color: var(--warn); }
    .empty-img { width: 280px; height: 180px; display: flex; align-items: center; justify-content: center; color: var(--earth-light); font-size: 0.85rem; border: 1px dashed var(--line); border-radius: 4px; background: var(--cream); }

    /* List widget */
    .list-items { display: flex; flex-direction: column; gap: 0.75rem; }
    .list-item { background: var(--cream); border: 1px solid var(--line); border-radius: 5px; padding: 1rem 1.25rem; }
    .list-item-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
    .list-item-head strong { flex: 1; font-size: 0.92rem; color: var(--sage-dark); font-weight: 500; }
    .list-item-head button { background: transparent; color: var(--earth-light); border: 1px solid var(--line); padding: 0.3rem 0.6rem; font-size: 0.78rem; }
    .list-item-head button:hover { background: white; color: var(--earth); }
    .list-item-head button.danger:hover { color: var(--warn); border-color: var(--warn); }
    .list-add { background: white; color: var(--sage-dark); border: 1px dashed var(--sage-dark); padding: 0.6rem 1rem; font-size: 0.88rem; margin-top: 0.5rem; }
    .list-add:hover { background: var(--cream); }

    /* String list (simple array of strings, e.g. quals) */
    .strlist-items { display: flex; flex-direction: column; gap: 0.4rem; }
    .strlist-row { display: flex; gap: 0.5rem; }
    .strlist-row input { flex: 1; padding: 0.5rem 0.75rem; border: 1px solid var(--line); border-radius: 4px; font-family: inherit; font-size: 0.92rem; background: white; }
    .strlist-row button { padding: 0.4rem 0.6rem; font-size: 0.78rem; background: transparent; color: var(--earth-light); border: 1px solid var(--line); }

    .actions {
      position: sticky; bottom: 0;
      background: linear-gradient(to top, var(--cream) 70%, transparent);
      padding: 1.5rem 0 1rem; margin-top: 1rem;
      display: flex; gap: 0.75rem; align-items: center;
    }
    button { background: var(--sage-dark); color: white; border: 0; padding: 0.65rem 1.5rem; border-radius: 4px; font-family: inherit; font-size: 0.95rem; cursor: pointer; transition: background 0.12s; }
    button:hover { background: var(--earth); }
    button:disabled { background: #aaa; cursor: not-allowed; }
    button.ghost { background: transparent; color: var(--earth-light); border: 1px solid var(--line); }
    .status { font-size: 0.88rem; margin-left: 0.5rem; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--warn); }
    .empty, .loading { color: var(--earth-light); padding: 1.5rem 0; }
    a.live-link { color: var(--sage-dark); font-size: 0.85rem; text-decoration: none; margin-left: auto; }
    a.live-link:hover { text-decoration: underline; }
  </style>
</head>

      'About', 'Community', 'Sacred Reciprocity', 'Book / Begin Here',

    function getNested(obj, path) {
      return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
    }
    function setNested(obj, path, value) {
      const parts = path.split('.');
      let cur = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        if (cur[parts[i]] == null || typeof cur[parts[i]] !== 'object') {
          cur[parts[i]] = /^\d+$/.test(parts[i + 1]) ? [] : {};
        }
        cur = cur[parts[i]];
      }
      cur[parts[parts.length - 1]] = value;
    }
    function escapeAttr(v) { return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

    let state = { slug: null, schema: null, data: null, sha: null, dirty: false };
    function setStatus(msg, cls) { const el = document.getElementById('saveStatus'); if (el) { el.textContent = msg || ''; el.className = 'status ' + (cls || ''); } }
    function markDirty() {
      state.dirty = true;
      const sb = document.getElementById('saveBtn'); if (sb) sb.disabled = false;
      const db = document.getElementById('discardBtn'); if (db) db.disabled = false;
      setStatus('Unsaved changes', 'err');
    }

    function buildNav() {
      document.getElementById('navList').innerHTML = Object.entries(SCHEMAS).map(([slug, s]) =>
        `<li><a href="#${slug}" data-page="${slug}">${s.title}</a></li>`).join('');
      document.getElementById('navStubs').innerHTML = STUB_PAGES.map(name => `<li><a class="stub">${name}</a></li>`).join('');
    }

    async function loadPage(slug) {
      const schema = SCHEMAS[slug];
      if (!schema) return;
      state.slug = slug; state.schema = schema;
      const main = document.getElementById('main');
      main.innerHTML = '<div class="loading">Loading…</div>';
      document.querySelectorAll('aside a').forEach(a => a.classList.toggle('active', a.dataset.page === slug));
      try {
        const res = await fetch(`${API}/file?path=${encodeURIComponent(schema.path)}`, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { content, sha } = await res.json();
        state.sha = sha;
        state.data = jsyaml.load(content) || {};
        state.dirty = false;
        renderEditor();
      } catch (e) {
        main.innerHTML = `<div class="empty" style="color:var(--warn)">Failed to load: ${e.message}</div>`;
      }
    }

    function renderEditor() {
      const { schema } = state;
      const main = document.getElementById('main');
      main.innerHTML = `
        <h2>${schema.title}</h2>
        <div class="crumb">Tending <code>${schema.path}</code> · changes reach the world within 1–2 minutes of saving <a class="live-link" href="${schema.liveUrl}" target="_blank">view the live page ↗</a></div>
        <div id="formRoot"></div>
        <div class="actions">
          <button id="saveBtn" disabled>Save</button>
          <button class="ghost" id="discardBtn" disabled>Discard changes</button>
          <span id="saveStatus" class="status"></span>
        </div>
      `;
      const root = document.getElementById('formRoot');
      schema.groups.forEach((g, gi) => {
        const sec = document.createElement('section');
        sec.className = 'group';
        sec.innerHTML = `<h3>${g.heading}</h3>${g.hint ? `<div class="group-hint">${g.hint}</div>` : ''}`;
        g.fields.forEach(f => sec.appendChild(renderField(f)));
        root.appendChild(sec);
      });
      document.getElementById('saveBtn').addEventListener('click', save);
      document.getElementById('discardBtn').addEventListener('click', () => loadPage(state.slug));
    }

    // Render any field. Returns a DOM element.
    function renderField(f) {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const value = getNested(state.data, f.name);

      if (f.widget === 'list') {
        wrap.innerHTML = `<label>${f.label}</label>${f.hint ? `<span class="hint">${f.hint}</span>` : ''}<div class="list-items" data-list-root="${f.name}"></div><button type="button" class="list-add" data-list-add="${f.name}">+ Add ${f.itemLabel || 'item'}</button>`;
        const root = wrap.querySelector(`[data-list-root="${f.name}"]`);
        const items = Array.isArray(value) ? value : [];
        items.forEach((_, i) => root.appendChild(renderListItem(f, i)));
        wrap.querySelector(`[data-list-add="${f.name}"]`).addEventListener('click', () => {
          const arr = (getNested(state.data, f.name) || []);
          const blank = {};
          (f.fields || []).forEach(sub => { blank[sub.name] = ''; });
          arr.push(blank);
          setNested(state.data, f.name, arr);
          markDirty();
          root.appendChild(renderListItem(f, arr.length - 1));
        });
        return wrap;
      }

      if (f.widget === 'strlist') {
        wrap.innerHTML = `<label>${f.label}</label>${f.hint ? `<span class="hint">${f.hint}</span>` : ''}<div class="strlist-items" data-strlist-root="${f.name}"></div><button type="button" class="list-add" data-strlist-add="${f.name}">+ Add ${f.itemLabel || 'item'}</button>`;
        const root = wrap.querySelector(`[data-strlist-root="${f.name}"]`);
        const items = Array.isArray(value) ? value : [];
        items.forEach((_, i) => root.appendChild(renderStrListItem(f, i)));
        wrap.querySelector(`[data-strlist-add="${f.name}"]`).addEventListener('click', () => {
          const arr = (getNested(state.data, f.name) || []);
          arr.push('');
          setNested(state.data, f.name, arr);
          markDirty();
          root.appendChild(renderStrListItem(f, arr.length - 1));
        });
        return wrap;
      }

      // Single-value field
      const id = 'f-' + f.name.replace(/\./g, '-');
      const label = `<label for="${id}">${f.label}</label>${f.hint ? `<span class="hint">${f.hint}</span>` : ''}`;
      if (f.widget === 'textarea') {
        wrap.innerHTML = `${label}<textarea id="${id}">${escapeAttr(value)}</textarea>`;
        wrap.querySelector('textarea').addEventListener('input', e => { setNested(state.data, f.name, e.target.value); markDirty(); });
      } else if (f.widget === 'select') {
        const opts = f.options.map(o => `<option value="${escapeAttr(o.value)}" ${o.value === value ? 'selected' : ''}>${o.label}</option>`).join('');
        wrap.innerHTML = `${label}<select id="${id}">${opts}</select>`;
        wrap.querySelector('select').addEventListener('change', e => { setNested(state.data, f.name, e.target.value); markDirty(); });
      } else if (f.widget === 'image') {
        wrap.appendChild(buildImageField(f, value, id, label));
        return wrap;
      } else {
        wrap.innerHTML = `${label}<input type="text" id="${id}" value="${escapeAttr(value)}" />`;
        wrap.querySelector('input').addEventListener('input', e => { setNested(state.data, f.name, e.target.value); markDirty(); });
      }
      return wrap;
    }

    // Build image field as a separate DOM tree (so list-item images get wired correctly)
    function buildImageField(f, value, id, label) {
      const v = String(value || '');
      const div = document.createElement('div');
      div.innerHTML = `${label}
        <div class="image-preview">
          ${v ? `<img id="${id}-preview" src="${escapeAttr(v)}" alt="">` : `<div id="${id}-preview" class="empty-img">No image yet</div>`}
          <div class="meta">
            <div>Current: <code id="${id}-current">${v ? escapeAttr(v) : '(none)'}</code></div>
            <div style="margin-top: 0.5rem; font-size: 0.78rem;">Replace by uploading a new file:</div>
          </div>
        </div>
        <div class="file-row">
          <label class="file-btn" for="${id}-file">Choose image…</label>
          <input type="file" id="${id}-file" accept="image/*" />
          <span class="upload-status" id="${id}-status"></span>
        </div>
        <input type="hidden" id="${id}" value="${escapeAttr(v)}">
      `;
      div.querySelector(`#${id}-file`).addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) await uploadImage(file, f, id);
        e.target.value = '';
      });
      return div;
    }

    function renderListItem(f, index) {
      const item = document.createElement('div');
      item.className = 'list-item';
      const head = document.createElement('div');
      head.className = 'list-item-head';
      head.innerHTML = `<strong>${f.itemLabel || 'Item'} ${index + 1}</strong>
        <button type="button" data-act="up">↑</button>
        <button type="button" data-act="down">↓</button>
        <button type="button" class="danger" data-act="del">Remove</button>`;
      item.appendChild(head);

      // Build sub-fields with nested name (e.g. offerings.cards.0.title)
      const subFields = (f.fields || []).map(sub => ({ ...sub, name: `${f.name}.${index}.${sub.name}` }));
      subFields.forEach(sub => item.appendChild(renderField(sub)));

      head.querySelector('[data-act="del"]').addEventListener('click', () => {
        const arr = getNested(state.data, f.name) || [];
        arr.splice(index, 1);
        setNested(state.data, f.name, arr);
        markDirty();
        // Re-render the whole list (simplest correct path)
        const root = item.parentElement;
        root.innerHTML = '';
        arr.forEach((_, i) => root.appendChild(renderListItem(f, i)));
      });
      head.querySelector('[data-act="up"]').addEventListener('click', () => moveListItem(f, index, -1, item));
      head.querySelector('[data-act="down"]').addEventListener('click', () => moveListItem(f, index, +1, item));
      return item;
    }

    function moveListItem(f, index, delta, itemEl) {
      const arr = getNested(state.data, f.name) || [];
      const newIdx = index + delta;
      if (newIdx < 0 || newIdx >= arr.length) return;
      [arr[index], arr[newIdx]] = [arr[newIdx], arr[index]];
      setNested(state.data, f.name, arr);
      markDirty();
      const root = itemEl.parentElement;
      root.innerHTML = '';
      arr.forEach((_, i) => root.appendChild(renderListItem(f, i)));
    }

    function renderStrListItem(f, index) {
      const row = document.createElement('div');
      row.className = 'strlist-row';
      const value = (getNested(state.data, f.name) || [])[index] ?? '';
      row.innerHTML = `<input type="text" value="${escapeAttr(value)}" placeholder="${f.itemLabel || ''}">
        <button type="button" data-act="up">↑</button>
        <button type="button" data-act="down">↓</button>
        <button type="button" data-act="del">×</button>`;
      row.querySelector('input').addEventListener('input', e => {
        const arr = getNested(state.data, f.name) || [];
        arr[index] = e.target.value;
        setNested(state.data, f.name, arr);
        markDirty();
      });
      row.querySelector('[data-act="del"]').addEventListener('click', () => {
        const arr = getNested(state.data, f.name) || [];
        arr.splice(index, 1);
        setNested(state.data, f.name, arr);
        markDirty();
        const root = row.parentElement;
        root.innerHTML = '';
        arr.forEach((_, i) => root.appendChild(renderStrListItem(f, i)));
      });
      row.querySelector('[data-act="up"]').addEventListener('click', () => moveStrItem(f, index, -1, row));
      row.querySelector('[data-act="down"]').addEventListener('click', () => moveStrItem(f, index, +1, row));
      return row;
    }
    function moveStrItem(f, index, delta, rowEl) {
      const arr = getNested(state.data, f.name) || [];
      const newIdx = index + delta;
      if (newIdx < 0 || newIdx >= arr.length) return;
      [arr[index], arr[newIdx]] = [arr[newIdx], arr[index]];
      setNested(state.data, f.name, arr);
      markDirty();
      const root = rowEl.parentElement;
      root.innerHTML = '';
      arr.forEach((_, i) => root.appendChild(renderStrListItem(f, i)));
    }

    // Image pipeline: accept up to 50 MB raw camera/phone files, auto-resize
    // anything bigger than 2400px on its longest edge, and re-encode JPEG at
    // quality 0.9 so the upload stays a manageable size and the live page
    // loads fast. PNG keeps PNG (preserves transparency); WebP keeps WebP;
    // SVG and GIF are passed through untouched.
    async function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('could not decode image')); };
        img.src = url;
      });
    }
    async function blobToBase64(blob) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => {
          const s = String(r.result || '');
          const i = s.indexOf(',');
          res(i >= 0 ? s.slice(i + 1) : s);
        };
        r.onerror = rej;
        r.readAsDataURL(blob);
      });
    }
    async function maybeResize(file, maxDim = 2400, jpgQuality = 0.9) {
      // Skip resize for SVG/GIF (canvas can't roundtrip these reliably).
      if (/\.(svg|gif)$/i.test(file.name) || file.type === 'image/svg+xml' || file.type === 'image/gif') {
        return { blob: file, name: file.name, type: file.type, w: null, h: null, resized: false };
      }
      let img;
      try { img = await loadImageFromFile(file); }
      catch { return { blob: file, name: file.name, type: file.type, w: null, h: null, resized: false }; }
      const ow = img.naturalWidth, oh = img.naturalHeight;
      const tooBig = ow > maxDim || oh > maxDim;
      // If already small AND under 2 MB, don't re-encode.
      if (!tooBig && file.size < 2_000_000) {
        return { blob: file, name: file.name, type: file.type, w: ow, h: oh, resized: false };
      }
      let nw = ow, nh = oh;
      if (tooBig) {
        const s = maxDim / Math.max(ow, oh);
        nw = Math.round(ow * s); nh = Math.round(oh * s);
      }
      const canvas = document.createElement('canvas');
      canvas.width = nw; canvas.height = nh;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, nw, nh);
      const isPng = /\.png$/i.test(file.name) || file.type === 'image/png';
      const isWebp = /\.webp$/i.test(file.name) || file.type === 'image/webp';
      const outType = isPng ? 'image/png' : (isWebp ? 'image/webp' : 'image/jpeg');
      const outExt = isPng ? '.png' : (isWebp ? '.webp' : '.jpg');
      const outName = file.name.replace(/\.[a-z0-9]+$/i, '') + outExt;
      const blob = await new Promise((res) => canvas.toBlob((b) => res(b || file), outType, jpgQuality));
      return { blob, name: outName, type: outType, w: nw, h: nh, resized: tooBig };
    }
    function fmtMb(bytes) { return (bytes / 1_000_000).toFixed(bytes < 1_000_000 ? 2 : 1) + ' MB'; }

    async function uploadImage(file, f, id) {
      const statusEl = document.getElementById(id + '-status');
      const setUS = (msg, cls) => { statusEl.textContent = msg; statusEl.className = 'upload-status ' + (cls || ''); };
      console.log('[studio] uploadImage', { name: file.name, type: file.type, size: file.size });
      if (file.size > 50_000_000) { setUS('File too large (max 50 MB raw)', 'err'); return; }
      if (/\.(heic|heif)$/i.test(file.name)) {
        setUS('iPhone HEIC photos aren’t supported by web browsers. On iPhone: Settings → Camera → Formats → Most Compatible. Or open the photo in Preview and File → Export As JPG.', 'err');
        return;
      }
      if (!/\.(jpe?g|png|webp|gif|svg|bmp|tiff?|avif)$/i.test(file.name)) {
        setUS('Unsupported file type: ' + file.name + '. Try JPG, PNG, WebP, GIF, or SVG.', 'err');
        return;
      }

      setUS('Optimizing…', '');
      let opt;
      try { opt = await maybeResize(file); }
      catch (e) {
        console.warn('[studio] resize failed, will try uploading original', e);
        opt = { blob: file, name: file.name, type: file.type, w: null, h: null, resized: false };
      }

      const dims = opt.w ? ` (${opt.w}×${opt.h})` : '';
      const sizeNote = opt.resized
        ? `${fmtMb(opt.blob.size)}${dims}, optimized from ${fmtMb(file.size)}`
        : `${fmtMb(opt.blob.size)}${dims}`;
      setUS(`Uploading ${sizeNote}…`, '');

      try {
        const base64 = await blobToBase64(opt.blob);
        const res = await fetch(`${API}/upload`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: opt.name, data_base64: base64 }),
        });
        const json = await res.json();
        console.log('[studio] upload response', res.status, json);
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        const url = json.path ? '/' + json.path : null;
        if (!url) throw new Error('no path returned');
        document.getElementById(id).value = url;
        setNested(state.data, f.name, url);
        const prev = document.getElementById(id + '-preview');
        if (prev) {
          if (prev.tagName === 'IMG') prev.src = url;
          else prev.outerHTML = `<img id="${id}-preview" src="${escapeAttr(url)}" alt="">`;
        }
        const cur = document.getElementById(id + '-current');
        if (cur) cur.textContent = url;
        setUS(`Uploaded — ${sizeNote}. Click Save to publish.`, 'ok');
        markDirty();
      } catch (e) {
        setUS('Upload failed: ' + e.message, 'err');
      }
    }

    async function save() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      setStatus('Saving…', '');
      const yaml = jsyaml.dump(state.data, { lineWidth: 100, noRefs: true });
      try {
        const res = await fetch(`${API}/file`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            path: state.schema.path,
            content: yaml,
            sha: state.sha,
            message: `Edit ${state.schema.title.toLowerCase()} via studio`,
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        state.sha = json.newSha || state.sha;
        state.dirty = false;
        const db = document.getElementById('discardBtn'); if (db) db.disabled = true;
        setStatus('Saved. The change reaches the world in 1–2 minutes.', 'ok');
      } catch (e) {
        btn.disabled = false;
        setStatus('Save failed: ' + e.message, 'err');
      }
    }

    function handleHash() {
      const slug = (location.hash || '#home').slice(1);
      if (SCHEMAS[slug]) loadPage(slug);
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('beforeunload', e => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

    (function start() {
      if (typeof jsyaml === 'undefined') { setTimeout(start, 50); return; }
      buildNav();
      handleHash();
    })();
  </script>
</body>
</html>
