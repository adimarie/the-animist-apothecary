<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio &mdash; The Animist Apothecary</title>
  <link rel="icon" href="/favicon.ico" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body>
  <!--
    Decap CMS — content editor for The Animist Apothecary.
    Loads from CDN; configuration lives in /studio/config.yml.
    Login uses GitHub OAuth proxied through a Supabase Edge Function.
  -->
  <script>
    // OAuth handoff fallbacks. window.opener can be severed during the
    // GitHub→Supabase→main-site redirect chain. We listen on three channels
    // (postMessage, localStorage 'storage' event, BroadcastChannel) and
    // re-dispatch any received auth message as a postMessage to ourselves
    // so Decap's listener catches it.
    (function () {
      function dispatch(message) {
        if (typeof message !== 'string') return;
        window.postMessage(message, window.location.origin);
      }

      function consumeStorage(value) {
        if (!value) return;
        try {
          var parsed = JSON.parse(value);
          if (parsed && typeof parsed.message === 'string') dispatch(parsed.message);
        } catch (e) {}
        try { localStorage.removeItem('decap-oauth-result'); } catch (e) {}
      }

      // Catch any value already in localStorage from a popup that closed before this script ran.
      try { consumeStorage(localStorage.getItem('decap-oauth-result')); } catch (e) {}

      window.addEventListener('storage', function (e) {
        if (e.key === 'decap-oauth-result' && e.newValue) consumeStorage(e.newValue);
      });

      // BroadcastChannel — designed for cross-tab communication, doesn't depend on opener.
      try {
        if (typeof BroadcastChannel === 'function') {
          var ch = new BroadcastChannel('decap-oauth');
          ch.onmessage = function (e) {
            if (e && e.data && typeof e.data.message === 'string') dispatch(e.data.message);
          };
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
</body>
</html>
