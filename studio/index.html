<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio &mdash; The Animist Apothecary</title>
  <link rel="icon" href="/favicon.ico" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body>
  <!--
    Decap CMS — content editor for The Animist Apothecary.
    Loads from CDN; configuration lives in /studio/config.yml.
    Login uses GitHub OAuth proxied through a Supabase Edge Function.
  -->
  <script>
    // OAuth handoff fallback: if window.opener was severed during the
    // GitHub→Supabase→main-site redirect chain, the popup can't postMessage
    // us directly. Listen for a localStorage write from the popup
    // (auth.html) and re-dispatch it as a postMessage to ourselves so
    // Decap's auth listener picks it up.
    (function () {
      function consume(value) {
        if (!value) return;
        try {
          var parsed = JSON.parse(value);
          if (parsed && typeof parsed.message === 'string') {
            window.postMessage(parsed.message, window.location.origin);
          }
        } catch (e) { /* ignore malformed values */ }
        try { localStorage.removeItem('decap-oauth-result'); } catch (e) {}
      }

      // Catch results that landed before this script ran.
      try { consume(localStorage.getItem('decap-oauth-result')); } catch (e) {}

      window.addEventListener('storage', function (e) {
        if (e.key === 'decap-oauth-result' && e.newValue) {
          consume(e.newValue);
        }
      });
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
</body>
</html>
