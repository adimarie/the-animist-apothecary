intro:
  section_label: "The Shape of It"
  title: "A living map of <em>where the work is</em>"
  paragraph_1: "This is a living calendar and migratory route — showing where Adi is, when, and why. Not just a schedule, but a map of sacred intention: for planning gatherings, finding places to speak and teach, connecting with lands that are calling, hosting salons, gathering around firesides."
  paragraph_2: "A place to bridge it all together — the solo healing work and the collective ceremonial work, the personal transformation and the planetary tending. Because they are not separate. They never were."

