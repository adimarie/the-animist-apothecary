practitioner:
  image: /images/adi-hero-portrait.jpg
  image_position: center top
  section_label: The Practitioner
  title: <em>Adi Marie</em>
  quals:
    - Therapeutic Coach
    - Entheogenic Medicine
    - Ceremonial & Ritual Stewardship
    - Interdimensional Intermediary & Guide
    - Somatic Medium & Diviner
    - Shamanic Bodyworker
    - Massage Therapist
    - Expressive Arts
  paragraph_1: >-
    After 16 years of devoted service and over a decade of initiation, study, and maturation — Adi
    Marie carries a medicine basket woven from traditional herbalism, animist cosmology, somatic
    awareness, shamanic practice, and the sacred arts of ceremony.
  paragraph_2: >-
    The work is held with doctors, medicine people, therapists, leaders of industry, and those
    whose decisions shape the trajectory of this earth ship — both as individuals and within the
    many constellations of their communities. The practice follows a migratory rhythm between
    Topanga and the wider lands, with seasons of deep nature retreat where the inner work is
    tended, and where the depths of the practice are kept fed.
  location: >-
    Based in Topanga Canyon, Los Angeles. Available worldwide for virtual sessions and private
    engagements, and in person along the migratory route, for those called to the land.
  cta_text: Read the longer story
  cta_url: about.html
process:
  section_label: ""
  title: Three movements of the <em>work</em>
  intro: >-
    I work with those ready to step in as stewards of the land and stewards of this work. We enter
    the special realms that open themselves to us — respectfully, reverentially — building
    relationship with those worlds, so that the space is beautifully tended for the many
    generations to come.
  questions:
    - Awakening or healing?
    - Solo or in kinship?
    - Once, or ongoing?
  steps:
    - number: I
      title: The Inquiry
      description: >-
        Listen for what is calling — let the readiness rise. Schedule a 90-minute paid Intake &
        Inquiry conversation, and write an introductory letter giving a full picture of what brings
        you to this work and what you are looking for. Putting it into words is part of the
        preparation; the process begins before we meet.
    - number: II
      title: The Work
      description: >-
        A preparatory process held with care. The ceremony itself, or a series of works tended in
        their season. Then integration and aftercare calls. The work moves through its full arc,
        attended at every turn.
    - number: III
      title: The Living Web
      description: >-
        What you have walked is part of an ancient process that continues to awaken and grow. You
        become kin within a wider weaving — practitioners, lineages, and the worlds themselves.
  cta_text: Apply for the Inquiry
  cta_url: book.html
testimonial:
  text: >-
    Working with Adi is like having the most skilled, loving, ferocious medicine person as your
    guide. She sees what others miss, holds what others drop, and moves you through the underworld
    with uncommon grace. My life is unrecognizably more alive.
  author: M.K. — Physician & Medicine Woman, New Mexico
cta_section:
  section_label: Begin the Work
  title: The earth grid needs<br><em>your medicine</em>.
  body: >-
    Some come for their own healing. Some come to walk a year as a ceremonialist in service to the
    living web. Either way, the season begins at the threshold.
  cta_text: Apply to Begin
  cta_url: book.html
