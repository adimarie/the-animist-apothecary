practitioner:
  image: /images/adi-hero-portrait.jpg
  image_position: center top
  section_label: The Practitioner
  title: <em>Adi Marie</em>
  quals:
    - Therapeutic Coach
    - Entheogenic Medicine
    - Ceremonial & Ritual Stewardship
    - Interdimensional Intermediary & Guide
    - Somatic Medium & Diviner
    - Shamanic Bodyworker
    - Massage Therapist
    - Expressive Arts
  paragraph_1: >-
    After 16 years of devoted service and over a decade of initiation, study, and maturation — Adi
    Marie carries a medicine basket woven from traditional herbalism, animist cosmology, somatic
    awareness, shamanic practice, and the sacred arts of ceremony.
  paragraph_2: >-
    Working with doctors, medicine people, therapists, leaders of industry, and those whose
    decisions shape the trajectory of this earth ship — both as individuals and within the many
    constellations of their communities.
  location: >-
    Based in Topanga Canyon, Los Angeles — available worldwide for virtual sessions, private
    engagements, and in person for those called to the land.
  cta_text: Read the Full Story
  cta_url: about.html
process:
  section_label: How to Begin
  title: Your path forward,<br><em>step by step</em>
  intro: The work begins with a simple, honest inquiry. From there, a path reveals itself.
  questions:
    - Awakening or Healing?
    - Solo or Groups?
    - Once or Ongoing?
  steps:
    - number: '01'
      title: Intake & Inquiry
      description: >-
        A paid Intake & Inquiry session (Pláticas rate) to feel the resonance, share your needs,
        assess readiness, and outline a path forward together. This is a substantive consultation —
        not a brief intro call.
    - number: '02'
      title: Choose Your Path
      description: >-
        Together we identify whether a Solo Acolyte intensive, group trajectory, or individual
        session best meets your readiness.
    - number: '03'
      title: Commit & Begin
      description: >-
        A deposit opens the container and signals your readiness. Dates are set. The work is engaged
        with full intention.
    - number: '04'
      title: Aftercare & Integration
      description: >-
        The work continues in the weaving. Integration practices and follow-up support are woven
        throughout every offering.
  cta_text: Begin Here — Book Your Call
  cta_url: book.html
testimonial:
  text: >-
    Working with Adi is like having the most skilled, loving, ferocious medicine person as your
    guide. She sees what others miss, holds what others drop, and moves you through the underworld
    with uncommon grace. My life is unrecognizably more alive.
  author: M.K. — Physician & Medicine Woman, New Mexico
