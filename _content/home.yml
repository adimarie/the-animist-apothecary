metamorphosis:
  image: /images/uploads/2026-05-07-1777185257768.jpeg
  image_position: center
  section_label: We live in a time of Great Awakening
  title: From bodywork to<br><em>deep soul tending</em>
  paragraph_1: >-
    After 16 years of service as a Somatic Touch Therapist and Hands-on Spiritual Practitioner — my
    work through Bodywork & Botanicals has come into a new evolution of specialized offerings and
    curation.
  paragraph_2: >-
    The many people who came seeking respite on the massage table almost always had deeper wounds
    that needed attending to — expressing as physical symptoms of disharmony within their system as
    pain.
  paragraph_3: >-
    After over a decade of devoted study, initiation, and maturation as an answer to the deeper
    calling of my gifts in service to the world, I now have a richer set of specialized skills to
    provide the much needed deep work to bring about life changing contact with the inner domains of
    Spirit and Self.
  quote: >-
    What has always been here remains: deep somatic tending, sacred space, relational care, and the
    devoted art of helping people return to themselves. <strong>And something new is arriving,
    too.</strong>
  evolution_intro: 'Bodywork & Botanicals has become the next evolution of shamanic care:'
  evolution_name: The Animist Apothecary
vision:
  section_label: The Greater Calling
  title: Healing the earth grid.<br><em>One ceremony at a time.</em>
  body_1: >-
    The great work of our time is not only personal — it is planetary. Adi Marie is cultivating
    communities of ceremonialists, building collective healing containers, and weaving systems of
    sacred resourcing in service to this precious planet and all sacred kin.
  body_2: >-
    The work is scaling — into group trajectories, community hubs, and training pathways — because
    the earth grid needs woven networks of healers, ceremonialists, and devotees of the living
    world.
  pillars:
    - title: Solo Intensives
      icon: —
      description: >-
        One-on-one Acolyte journeys for deep personal transformation and spiritual sovereignty —
        held with full presence and devotion.
    - title: Community & Groups
      icon: — —
      description: >-
        Themed group trajectories, eco-immersions, firesides, and collective healing containers in
        devoted service to the life web.
    - title: Private Engagements
      icon: ———
      description: >-
        Bespoke ceremonial work, retreats, and consulting for leaders, organizations, and
        communities of practitioners.
