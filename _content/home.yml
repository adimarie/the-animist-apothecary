metamorphosis:
  image: /images/uploads/2026-05-07-1777185257768.jpeg
  image_position: center
  section_label: A Calling of These Times
  title: We are living through<br>a <em>Great Awakening</em>.
  paragraph_1: >-
    We are in the turning of the Kali Yuga page. Things are maximizing in their darkness, and at the
    same moment something ancient is stirring back through the layers of rupture. The dormant
    lineages of power are reawakening. Old ancestral families exiled from this realm are reaching
    through, asking to be midwifed home. Gaia is dreaming us awake. The more-than-human kin are
    speaking. The earth grid is calling out to the ones who can hold it.
  paragraph_2: >-
    I believe this is real, and not a metaphor. I believe the great work of our time is not only
    personal, it is planetary. I believe the body and the earth are not two things. I believe
    healing the small wound and healing the world are the same fire. I believe lineage is being
    asked to flow again, and that the medicine people who can carry that flow are being called
    forward now.
  paragraph_3: >-
    For sixteen years I have been listening to this on the massage table, and for more than a decade
    in the deeper rooms of initiation, study, and maturation. The medicine basket has widened to
    meet what is being asked of us.
  quote: >-
    What has always been here remains: deep somatic tending, sacred space, relational care, and the
    devoted art of helping people return to themselves. <strong>And something new is arriving,
    too.</strong>
  evolution_intro: The next evolution of this work
  evolution_name: The Animist Apothecary
vision:
  section_label: What This Work Tends
  title: Healing the earth grid,<br><em>one ceremony at a time</em>.
  body_1: >-
    The great work of our time is not only personal — it is planetary. The body and the earth are
    not two things; healing the small wound and healing the world are the same fire. This practice
    is shaped to that truth.
  body_2: >-
    The work moves in three shapes — solo containers held with full devotion, communal fires that
    weave the kin together, and bespoke engagements for those whose decisions shape the world.
  pillars:
    - title: The Solo Path
      icon: —
      description: >-
        One-on-one acolyte work for deep personal transformation, spiritual sovereignty, and the
        long arc of becoming. Held with full presence.
      link_text: Apply for solo work
      link_url: book.html
    - title: The Communal Fire
      icon: — —
      description: >-
        Themed group trajectories, seasonal ceremonies, eco-immersions, and clinics in devoted
        service to the living web.
      link_text: See community work
      link_url: community.html
    - title: Bespoke Engagements
      icon: ———
      description: >-
        Private ceremonial work, retreats, and counsel for leaders, organizations, and the
        constellations of practitioners they hold.
      link_text: Inquire for private work
      link_url: book.html
