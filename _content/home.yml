metamorphosis:
  image: /images/uploads/longer-story-milky-canyon.jpg
  image_position: center
  section_label: The Longer Story
  title: Welcome to an eternal edge of infinite horizons
  intro: An invitation to the thresholds of life's great work.
  paragraph_1: >-
    We are in the turning of the Great Wheels of Time. Our era is overwhelmed and revealing of its
    churning darkness, and at the same moment something ancient is stirring back through the layers
    of revelation. The dormant lineages of power are reawakening. Old ancestral families exiled
    from this realm are reaching through, asking to be midwifed home. Gaia is dreaming us awake.
    The more-than-human kin are speaking. The earth grid is calling out to the ones who can hold
    and embody it as they walk this world.
  paragraph_2: >-
    I believe that this is real, and ever more fully underway. I believe the great
    work of our time is not only personal, it is planetary. I believe the body and the earth are
    connected by the light of our sacred flames; and that healing the wounds and wars within
    brings healing and peace to the world throughout. I believe these lineages are being called to
    flow again, and that the people of medicine and power who can be anchors and conduits to that
    flow are being called forward now.
  paragraph_3: >-
    We are each so deeply guided, and held in the currents of the Divine Plan. May we take our place
    within the pantheon and bring the blessings of our grace. May you find yourself deepening as you
    enter this space.
  quote: >-
    <p>You are the scintillating poetry of Creation; woven of Waters, Earth, and Sky. The
    Miraculous Dream living within the embrace of The Infinite Seas.</p>
    <p>I walk with you through the darkness, and keep steady vigil of your growing light. Holding
    faith in the quiet alchemy unfolding within your own metamorphosis.</p>
  evolution_intro: Is this what your path has been calling for?
  evolution_name: The Animist Apothecary
