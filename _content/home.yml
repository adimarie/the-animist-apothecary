practitioner:
  image: /images/uploads/practitioner-midnight-sorceress.jpg
  image_position: center top
  section_label: Your Practitioner
  title: <em>Adi Marie</em>
  quals:
    - Interdimensional Intermediary & Guide
    - Somatic Medium & Oracular Diviner
    - Ceremonial & Ritual Stewardship
  paragraph_1: >-
    This work is based in Southern California with a regular migratory route along the North
    American West Coast. Adi Marie is flown around the world serving individuals and communities
    ready to embark upon and enact great change — first and foremost within themselves, to then
    do so to the world around.
  paragraph_2: >-
    Adi has always had an immense power and gift in the spoken word, serving as an oracular poet,
    mythmaker, and storyteller — synthesizing and cohering the messages from the otherworlds into
    a tapestry of tales for us to live within. This gift has been formalized through her initiation
    as a voice diviner, having been chosen for the role by the Spirit World.
  paragraph_3: >-
    Her gifts of somatic mediumship led her into medical, therapeutic, and shamanic bodywork,
    providing deep spiritual and emotional openings for physicalization and somatic expression and
    embodiment of the psyche and soul. Adi Marie has over 19 years of experience in the world of
    medicines of the wilds, specializing in entheogenic sacraments — guiding others through
    specialized and extraordinary states of visionary consciousness.
  serves_quote_epigraph: >-
    For those whose inner work moves outward — and impacts thousands of lives — whose healing
    shapes collective fields of community and industry — for the innovators, the creators, and
    the world shapers, this work is for you.
  serves_quote_stanza_1: >-
    Adi Marie works with visionary leaders and masters of craft — those passionate in their
    disciplines, ready to step deeper into the mysteries of the ineffable within their inner
    worlds, and to plunge the depths to bring more light to the worlds we share.
  serves_quote_stanza_2: >-
    She also works with established communities to further their healing — so that those who are
    ready may begin to step into their leadership and elderhood, forming nutritive and nourishing
    ecosystems within which the children, the troubled, the lost, and the youth may heal and be
    held, thrive and grow, and bring forth hope for the restoration of the village amidst the
    urban sprawl.
  serves_quote_stanza_3: >-
    She helps those ready to hone their burgeoning spiritual gifts into formidable powers — to be
    wielded benevolently in the shaping of a more beautiful world we all know is possible.
  cta_text: Read the longer story
  cta_url: about.html
