# The Wheel — calendar of gatherings and the migratory route
# Edit via /studio/. Every event below is editable; reorder, add, or
# remove via the studio's list widget. Saves commit to GitHub and the
# change reaches the world in 1–2 minutes.

hero:
  image: "/images/uploads/hero-tree-canopy.jpg"
  image_position: "center 35%"
  eyebrow: "The Wheel"
  title: "The coming <em>season</em>"
  subtitle: "Where the work meets the year — and where I'll be when."

migratory:
  section_label: "The Migratory Route"
  intro: >-
    The practice follows a migratory rhythm — the home canyon as anchor, the wider lands as
    called. Each season carries its own work; each landing, its own gatherings.
  stops:
    - place: "Southern California"
      season: "Spring"
      months: "March – May"
      note: "Anchor practice. Sacred Breath, Pláticas, weekly clinics."
    - place: "Santa Fe & Taos"
      season: "High Summer"
      months: "Late June – Mid July"
      note: "Private engagements. Retreat in the high desert."
    - place: "Southern California"
      season: "Late Summer"
      months: "Late July – September"
      note: "Cohort intakes. Fall preparation."
    - place: "Mexico City & Oaxaca"
      season: "Autumn"
      months: "October"
      note: "Pilgrimage. Ancestral and elemental work."
    - place: "Southern California"
      season: "Winter"
      months: "November – February"
      note: "Solstice ceremonies. Year-long cohorts continue."

events_section_label: "The Coming Year"
events_intro: >-
  Below: gatherings, ceremonies, and cohort openings as they arrive on the wheel.
  If a date is full, ask anyway — the container shapes itself around the right people.

