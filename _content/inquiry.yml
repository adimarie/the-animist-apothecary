# Inquiry form page editable content. Saves commit to GitHub via /studio/.
# js/content-loader.js reads this and patches inquiry.html.
# The note posts to the intranet RPC submit_inquiry (wired 2026-05-27); emailing it onward to Adi Marie is the next wiring step (2026-11-09).

hero:
  image: "/images/uploads/begin-hero-forest-path.jpg?v=1"
  image_alt: "A forest path opening between tall trees and green ferns."
  image_position: "28% 62%"
  image_size: "cover"
  eyebrow: "Begin Here"
  # The title and subtitle carry the same line spans as the HTML, so the loader keeps the hand-placed line breaks.
  title: '<span class="ht ht-1">It begins with</span><span class="ht ht-2"><em>a conversation</em>.</span>'
  subtitle: '<span class="hs">Schedule your first session: an intake,</span> <span class="hs">or a single session of counsel or divination.</span>'

form_intro:
  title: "Tell us what <em>brings you</em>."
  body: "If you would rather write first, you are welcome to. What you write here reaches Adi Marie directly. Every note is read by hand, and we respond within 48 hours."

form_labels:
  first_name: "First Name"
  first_name_placeholder: "Your first name"
  last_name: "Last Name"
  last_name_placeholder: "Your last name"
  email: "Email Address"
  email_placeholder: "your@email.com"
  phone: "Phone (optional)"
  phone_placeholder: "+1 (555) 000-0000"
  referral_label: "How did you find out about The Animist Apothecary?"
  referral_placeholder: "Referral, social, search, word of mouth..."
  carrying_label: "What are you carrying? What are you seeking?"
  carrying_placeholder: "Where you are, what you're navigating, what you're hoping to find. There is no wrong thing to say. Only the true thing."
  aligned_label: "What about this work feels aligned for you?"
  offerings_label: "What are you looking for? (Select all that apply.)"
  format_label: "How would you like to work?"
  timing_label: "Time-sensitivity"
  care_label: "Anything important to know to meet you with care?"
  submit_text: "Send the Note"
  submit_note: "Every message is read by hand. We respond within 48 hours."
