hero:
  image: "https://images.unsplash.com/photo-1672196799313-047c77f87f80?w=1400&h=600&fit=crop&q=80"
  image_alt: "The threshold image for Begin Here, the gateway to The Animist Apothecary."
  image_position: "center"
  image_size: "cover"
  eyebrow: "Cross the Threshold"
  title: "Begin <em>here</em>"
  subtitle: "A conversation first. Always."

intro:
  section_label: "The Threshold"
  title: "Three doors. <em>Each an honest beginning.</em>"
  body: "Begin Here is the entry to working with Adi Marie. Three ways to come close to the work, in order of depth. The conversation comes first, always."

doors:
  section_label: "Three Doors"
  title: "How would you like to <em>begin.</em>"
  body: "Choose the door that matches where you stand."

practitioner:
  image: "images/adi-hero-portrait.jpg"
  image_position: "center top"
  section_label: "The Practitioner"
  title: "<em>Adi Marie.</em>"
  body_1: "Adi Marie carries a medicine basket woven from traditional herbalism, animist cosmology, somatic awareness, shamanic practice, and the sacred arts of ceremony. Sixteen years of devoted service, over a decade of initiation and study."
  body_2: "She works with doctors, medicine people, therapists, leaders, and those whose decisions shape the trajectory of this earth ship. Solo and in community."
  location: "Based in Southern California. Available worldwide for virtual work, in person for those called to the land."
  cta_text: "Read the full story &rarr;"

reciprocity:
  section_label: "Sacred Reciprocity"
  title: "Rates flow from the <em>work that takes shape.</em>"
  body: "The conversation itself is a paid one, held in sacred reciprocity. Rates vary by format (group, solo session, developmental arcs, classes, ongoing work). What is right is shaped in the Intake & Inquiry conversation, where the work itself begins to take form."
  cta_text: "Read more about Sacred Reciprocity &rarr;"

testimonial:
  mark: "&ldquo;"
  text: "Working with Adi is like having the most skilled, loving, ferocious medicine person as your guide. She sees what others miss, holds what others drop, and moves you through the underworld with uncommon grace. My life is unrecognizably more alive."
  author: "M.K., Physician & Medicine Woman, New Mexico"

steps_section:
  section_label: "How the Work Begins"
  title: "A conversation first. <em>Always.</em>"
  steps:
    - number: "01"
      title: "We Read Your Note"
      description: "Every inquiry is read by hand. We take the time to understand what you're carrying before we respond."
    - number: "02"
      title: "We Find an Hour"
      description: "A short introductory call. To feel the resonance, ask the questions, and see what shape the work might take."
    - number: "03"
      title: "We Shape the Container"
      description: "If it's right for both of us, we design the container together. The work begins on your terms."

subscribe:
  section_label: "Seasonal Letters"
  title: "Stay close to the <em>work.</em>"
  body: "Slow letters from the practice. Sent with the seasons. Free, no obligation."
  cta_text: "Subscribe"
