    - "Expressive Arts Facilitator"
    - "Dagara Lineage Diviner"
    - "Botanical Medicine"
    - "Generative Hypnosis"

musings:
  section_label: "Musings, Writing & More"
  items:
    - title: "Writing, Musings & Poetics"
      paragraph_1: "Adi Marie writes from the interworlds — from the place where the personal dissolves into the mythic, where language strains to hold what the ceremony already knows. Her writing spans reflective essays, poetic transmissions, and candid meditations on the nature of healing, initiation, and the living world."
      paragraph_2: "Current writing is being gathered and will be published here in ongoing installments. Subscribe to the newsletter to be notified when new pieces arrive."
      cta_text: "Join the Newsletter"
      cta_url: "community.html#newsletter"
    - title: "Workshops & Teaching"
      paragraph_1: "Adi Marie offers workshops and intensive teaching programs for those developing their own ceremonial and healing practice. Teaching topics include: Introduction to Animist Cosmology & Earth-Based Practice, Sacred Breath Facilitation Training, Ceremonial Design & Ritual Architecture, Ancestral Healing & Lineage Repair, Somatic Awareness for Healing Practitioners, Expressive Arts as Ceremonial Tool."
      paragraph_2: "Upcoming dates announced via newsletter. Private teaching engagements available for groups of 6 or more."
      cta_text: "Inquire About Teaching"
      cta_url: "book.html"
    - title: "Appearances & Speaking"
      paragraph_1: "Adi Marie is available for speaking engagements, panel participation, podcast appearances, and ceremonial leadership at events. She speaks with power and accessibility on: animist worldviews and their relevance to the current moment, the intersection of indigenous wisdom and contemporary healing, ceremonial culture as medicine for the collective, somatic awareness and the body's intelligence, earth-based spirituality and ecological grief."
      paragraph_2: "To book Adi for an appearance, use the contact form and describe your event."
      cta_text: "Invite Adi to Speak"
      cta_url: "book.html"
    - title: "Blog & Journal"
      paragraph_1: "The journal is a living document — reflections from the practice, dispatches from the road, transmissions from the in-between worlds. Written in the heat of the experience, close to the bone."
      paragraph_2: "Recent topics: On the grief of the living world and why we must feel it. What the body knows that the mind hasn't caught up to yet. The difference between spirituality and spiritual bypassing. Canyon medicine: what Topanga teaches those who listen."
      cta_text: "Subscribe for Updates"
      cta_url: "community.html#newsletter"

