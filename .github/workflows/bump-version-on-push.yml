# Bump version on every push to main.
# Runs only when the push is NOT our own bump commit ([skip ci]), so we avoid a loop.
# CNAME-only pushes (GitHub Pages custom-domain saves) are ignored — no version bump needed.
# Version is incremented and all HTML + version.json are updated, then committed and pushed.

name: Bump version on push to main

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CNAME'

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    concurrency:
      group: version-main-sequence
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Tailwind CSS
        run: npm ci && npm run css:build

      - name: Bump version
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RELEASE_COMPARE_FROM_SHA: ${{ github.event.before }}
          RELEASE_COMPARE_TO_SHA: ${{ github.sha }}
          RELEASE_PUSH_SHA: ${{ github.sha }}
          RELEASE_ACTOR_LOGIN: ${{ github.actor }}
          RELEASE_BRANCH: main
          RELEASE_PUSHED_AT: ${{ github.event.head_commit.timestamp }}
          RELEASE_SOURCE: github-main-push
        run: ./scripts/bump-version.sh --model ci

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No version changes (unexpected)" && exit 1 || true
          git commit -m "chore: bump version [skip ci]"
          # main can move under us (e.g. Pages settings saves commit CNAME changes),
          # so rebase and retry instead of failing on a non-fast-forward push.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push version bump after 5 attempts" >&2
          exit 1
